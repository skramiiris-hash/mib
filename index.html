<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIB</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='l' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%233a3f47'/%3E%3Cstop offset='1' stop-color='%23050506'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%23111214'/%3E%3Cpath d='M7 25.5h50' stroke='%23c9cdd3' stroke-width='2.6' stroke-linecap='round'/%3E%3Cpath d='M9.5 25.5h20.5c0 8.5-3.5 13.5-10.5 13.5S9.5 34 9.5 25.5z' fill='url%28%23l%29' stroke='%23c9cdd3' stroke-width='2'/%3E%3Cpath d='M34 25.5h20.5c0 8.5-3.5 13.5-10 13.5S34 34 34 25.5z' fill='url%28%23l%29' stroke='%23c9cdd3' stroke-width='2'/%3E%3Cpath d='M13.5 29l5-2.5M38 29l5-2.5' stroke='%23fff' stroke-opacity='.55' stroke-width='1.8' stroke-linecap='round'/%3E%3Ctext x='32' y='54' text-anchor='middle' font-family='Helvetica,Arial,sans-serif' font-size='9.5' font-weight='700' letter-spacing='2' fill='%23c9cdd3'%3EMIB%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #111214; --card: #1b1d21; --line: #2a2d33; --text: #f2f3f5; --muted: #8b9099;
    --live: #2fbf71; --away: #f0a830; --rec: #e5484d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
  .wrap { max-width: 360px; margin: 0 auto; padding: 22px 18px; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: .2px; }
  .status { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
  .dot.ok { background: var(--live); } .dot.bad { background: var(--rec); }
  .preview { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 14px; overflow: hidden;
    border: 1px solid var(--line); }
  .preview video, .preview img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: none; }
  .preview .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted);
    font-size: 13px; text-align: center; padding: 16px; }
  .badge { position: absolute; top: 10px; left: 10px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px;
    font-weight: 700; letter-spacing: .6px; background: rgba(0,0,0,.6); display: none; align-items: center; gap: 6px; }
  .badge.live { color: var(--live); display: flex; } .badge.away { color: var(--away); display: flex; }
  .recbadge { position: absolute; top: 10px; right: 10px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px;
    font-weight: 700; color: #fff; background: var(--rec); display: none; }
  .recbadge.on { display: block; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .55; } }
  .loopage { display: flex; align-items: center; gap: 9px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; font-size: 14px; }
  .loopage::before { content: ''; width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--rec); }
  .loopage.fresh { color: var(--text); } .loopage.fresh::before { background: var(--live); }
  .loopage.old { color: #ff8a8d; border-color: rgba(229,72,77,.45); }
  button.big { appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 14px; padding: 18px 16px; font-size: 18px; font-weight: 600; text-align: left; cursor: pointer;
    display: flex; align-items: center; gap: 14px; transition: background .15s, border-color .15s, opacity .15s; }
  button.big:hover:not(:disabled) { background: #22252a; }
  button.big:disabled { opacity: .35; cursor: not-allowed; }
  button.big.active:disabled { opacity: 1; cursor: default; }
  button.big small { display: block; font-size: 12.5px; font-weight: 400; color: var(--muted); margin-top: 2px; }
  .icon { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; }
  #rec .icon { border: 2px solid var(--rec); } #rec .icon i { width: 14px; height: 14px; border-radius: 50%; background: var(--rec); }
  #rec.on { border-color: var(--rec); background: #2a1719; } #rec.on .icon i { border-radius: 3px; }
  #away .icon { background: rgba(240,168,48,.15); color: var(--away); }
  #live .icon { background: rgba(47,191,113,.15); color: var(--live); }
  #away.active { border-color: var(--away); background: #2a2214; }
  #live.active { border-color: var(--live); background: #142a1e; }
  .msg { min-height: 20px; font-size: 13px; color: var(--away); text-align: center; }
  .hint { font-size: 12.5px; color: var(--muted); text-align: center; }
  details { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
  summary { cursor: pointer; }
  label { display: block; margin-top: 10px; }
  input { width: 100%; margin-top: 4px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 14px; }
  .save { margin-top: 10px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: #262a30; color: var(--text); cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MIB x Kaarthik</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="conn">Connecting…</span></div>
  </header>

  <div class="preview" title="What Webex sees">
    <video id="pv" autoplay muted playsinline></video>
    <img id="pi" alt="">
    <div class="empty" id="pe">Preview starts once connected to OBS</div>
    <span class="badge" id="badge"></span>
    <span class="recbadge" id="recbadge">● REC</span>
  </div>

  <div class="loopage" id="loopage">No away video yet</div>

  <button class="big" id="rec" disabled>
    <span class="icon"><i></i></span>
    <span><span id="recLabel">Record away video</span><small id="recSub">Sit still for 1–2 minutes, then press again</small></span>
  </button>

  <button class="big" id="away" disabled>
    <span class="icon">⏸</span>
    <span>Away<small id="awaySub">Show the away video · then mute Webex ⌘⇧M</small></span>
  </button>

  <button class="big" id="live" disabled>
    <span class="icon">●</span>
    <span>Live<small>Back on camera · then unmute ⌘⇧M</small></span>
  </button>

  <div class="msg" id="msg"></div>
  <div class="hint">In Webex, the camera should be “OBS Virtual Camera”.</div>

  <details>
    <summary>Settings</summary>
    <label>OBS WebSocket password
      <input id="pw" type="password" placeholder="From OBS → Tools → WebSocket Server Settings"></label>
    <label>Port <input id="port" value="4455"></label>
    <label>Live scene name <input id="liveName" value="Live"></label>
    <label>Away scene name <input id="awayName" value="Away"></label>
    <button class="save" id="save">Save &amp; reconnect</button>
  </details>
</div>

<script>
/* ---------- tiny SHA-256 (no internet or secure context needed) ---------- */
const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
function sha256(msg) { // Uint8Array -> Uint8Array(32)
  const l = msg.length, nb = ((l + 9 + 63) >> 6) << 6, b = new Uint8Array(nb);
  b.set(msg); b[l] = 0x80;
  const bits = l * 8; const dv = new DataView(b.buffer);
  dv.setUint32(nb - 4, bits >>> 0); dv.setUint32(nb - 8, Math.floor(bits / 0x100000000));
  let h = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const w = new Uint32Array(64), r = (x, n) => (x >>> n) | (x << (32 - n));
  for (let o = 0; o < nb; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = r(w[i-15],7) ^ r(w[i-15],18) ^ (w[i-15] >>> 3);
      const s1 = r(w[i-2],17) ^ r(w[i-2],19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
    }
    let [a,bb,c,d,e,f,g,hh] = h;
    for (let i = 0; i < 64; i++) {
      const t1 = (hh + (r(e,6) ^ r(e,11) ^ r(e,25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((r(a,2) ^ r(a,13) ^ r(a,22)) + ((a & bb) ^ (a & c) ^ (bb & c))) | 0;
      hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = bb; bb = a; a = (t1 + t2) | 0;
    }
    h = [h[0]+a, h[1]+bb, h[2]+c, h[3]+d, h[4]+e, h[5]+f, h[6]+g, h[7]+hh].map(x => x | 0);
  }
  const out = new Uint8Array(32), odv = new DataView(out.buffer);
  h.forEach((x, i) => odv.setUint32(i * 4, x >>> 0));
  return out;
}
const enc = s => new TextEncoder().encode(s);
const b64 = u => btoa(String.fromCharCode(...u));
function obsAuth(password, salt, challenge) {
  const secret = b64(sha256(enc(password + salt)));
  return b64(sha256(enc(secret + challenge)));
}

/* ---------- settings ---------- */
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem('classmode.' + k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('classmode.' + k, v); } catch {} }
};
const cfg = {};
// The MIB launcher on the Mac passes OBS's password in the address (#pw=…&port=…). Save it, then wipe it from the address.
(function takeHandoff() {
  if (!location.hash.includes('pw=')) return;
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get('pw')) store.set('pw', p.get('pw'));
  if (p.get('port')) store.set('port', p.get('port'));
  try { history.replaceState(null, '', location.pathname + location.search); } catch {}
})();
function loadCfg() {
  cfg.pw = store.get('pw', ''); cfg.port = store.get('port', '4455');
  cfg.live = store.get('live', 'Live'); cfg.away = store.get('away', 'Away');
  $('pw').value = cfg.pw; $('port').value = cfg.port; $('liveName').value = cfg.live; $('awayName').value = cfg.away;
}

/* ---------- OBS WebSocket v5 client ---------- */
let ws = null, pending = {}, reqId = 0, identified = false, retry = null;
const state = { scene: null, recording: false, recStart: 0, vcam: false, setupOk: null, awayStart: null };

function connect() {
  clearTimeout(retry);
  if (ws) { try { ws.onclose = null; ws.close(); } catch {} }
  identified = false; setConn('Connecting…', '');
  try { ws = new WebSocket(`ws://127.0.0.1:${cfg.port}`); }
  catch { return scheduleRetry(); }
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.op === 0) { // Hello
      const d = { rpcVersion: 1, eventSubscriptions: 4 | 64 }; // Scenes + Outputs
      if (m.d.authentication) {
        if (!cfg.pw) { setConn('Needs password', 'bad'); say('Open MIB from the Dock so it can connect.'); return; }
        d.authentication = obsAuth(cfg.pw, m.d.authentication.salt, m.d.authentication.challenge);
      }
      ws.send(JSON.stringify({ op: 1, d }));
    } else if (m.op === 2) { identified = true; setConn('Connected to OBS', 'ok'); say(''); init(); }
    else if (m.op === 5) onEvent(m.d.eventType, m.d.eventData || {});
    else if (m.op === 7) {
      const p = pending[m.d.requestId]; if (!p) return; delete pending[m.d.requestId];
      m.d.requestStatus.result ? p.res(m.d.responseData || {}) : p.rej(new Error(m.d.requestStatus.comment || 'OBS error'));
    }
  };
  ws.onclose = ev => {
    identified = false; render();
    if (ev.code === 4009) { setConn('Wrong password', 'bad'); say('Can’t connect — close this window and open MIB from the Dock again.'); return; }
    setConn('OBS not reachable', 'bad');
    say('Not connected — open MIB from the Dock (it starts everything).');
    scheduleRetry();
  };
}
function scheduleRetry() { retry = setTimeout(connect, 3000); }
function call(requestType, requestData) {
  return new Promise((res, rej) => {
    if (!ws || !identified) return rej(new Error('Not connected to OBS'));
    const requestId = 'r' + (++reqId); pending[requestId] = { res, rej };
    ws.send(JSON.stringify({ op: 6, d: { requestType, requestId, requestData } }));
  });
}

async function init() {
  try {
    const s = await call('GetCurrentProgramScene');
    state.scene = s.sceneName || s.currentProgramSceneName;
    const r = await call('GetRecordStatus');
    state.recording = !!r.outputActive; state.recStart = Date.now() - (r.outputDuration || 0);
    const v = await call('GetVirtualCamStatus');
    if (!v.outputActive) await call('StartVirtualCam');
    state.vcam = true;
    if (state.scene === cfg.away) state.awayStart = Number(store.get('awayStart', 0)) || Date.now();
  } catch (e) { say(e.message); }
  render();
  await selfSetup();
  render();
  startPreview();
}

/* ---------- self-setup: check and fix OBS every time we connect ---------- */
async function selfSetup() {
  const fixed = [];
  try {
    const vs = await call('GetVideoSettings');
    const W = vs.baseWidth, H = vs.baseHeight;

    // Recording: always the same file name, overwritten each time.
    const getP = (c, n) => call('GetProfileParameter', { parameterCategory: c, parameterName: n }).then(r => r.parameterValue);
    const setP = (c, n, v) => call('SetProfileParameter', { parameterCategory: c, parameterName: n, parameterValue: v });
    if (await getP('Output', 'FilenameFormatting') !== 'away_loop') { await setP('Output', 'FilenameFormatting', 'away_loop'); fixed.push('recording name'); }
    if (await getP('Output', 'OverwriteIfExists') !== 'true') { await setP('Output', 'OverwriteIfExists', 'true'); fixed.push('overwrite'); }
    const sec = (await getP('Output', 'Mode')) === 'Advanced' ? 'AdvOut' : 'SimpleOutput';
    const recFmt = (await getP(sec, 'RecFormat2')) || (await getP(sec, 'RecFormat')) || 'mkv';
    const ext = { fragmented_mp4: 'mp4', hybrid_mp4: 'mp4', fragmented_mov: 'mov', hybrid_mov: 'mov' }[recFmt] || recFmt;
    const dir = (await call('GetRecordDirectory')).recordDirectory.replace(/\/+$/, '');
    const loopPath = `${dir}/away_loop.${ext}`;

    const sceneNames = (await call('GetSceneList')).scenes.map(s => s.sceneName);
    const inputNames = (await call('GetInputList')).inputs.map(i => i.inputName);
    const items = scene => call('GetSceneItemList', { sceneName: scene }).then(r => r.sceneItems);
    const ensureInput = async (scene, name, kind, settings) => {
      if (inputNames.includes(name)) await call('CreateSceneItem', { sceneName: scene, sourceName: name });
      else { await call('CreateInput', { sceneName: scene, inputName: name, inputKind: kind, inputSettings: settings }); inputNames.push(name); }
    };
    const fit = async (scene, id) => {
      const t = (await call('GetSceneItemTransform', { sceneName: scene, sceneItemId: id })).sceneItemTransform;
      if (t.boundsType === 'OBS_BOUNDS_SCALE_INNER' && t.boundsWidth === W && t.boundsHeight === H && !t.positionX && !t.positionY) return false;
      await call('SetSceneItemTransform', { sceneName: scene, sceneItemId: id, sceneItemTransform: {
        positionX: 0, positionY: 0, rotation: 0, alignment: 5,
        boundsType: 'OBS_BOUNDS_SCALE_INNER', boundsAlignment: 0, boundsWidth: W, boundsHeight: H } });
      return true;
    };

    // Live scene with the webcam, filling the frame.
    if (!sceneNames.includes(cfg.live)) { await call('CreateScene', { sceneName: cfg.live }); fixed.push('Live scene'); }
    const isCam = i => /av_?capture/i.test(i.inputKind || '');
    let cam = (await items(cfg.live)).find(isCam);
    if (!cam) {
      const kinds = (await call('GetInputKindList', { unversioned: false })).inputKinds;
      const kind = kinds.find(k => k === 'macos-avcapture') || kinds.find(k => /av_?capture/i.test(k));
      if (!kind) throw new Error('No webcam source type found in OBS');
      await ensureInput(cfg.live, 'MIB Webcam', kind, {});
      try {
        const p = await call('GetInputPropertiesListPropertyItems', { inputName: 'MIB Webcam', propertyName: 'device' });
        const dev = p.propertyItems.find(x => x.itemEnabled !== false && x.itemValue);
        if (dev) await call('SetInputSettings', { inputName: 'MIB Webcam', inputSettings: { device: dev.itemValue } });
      } catch {}
      cam = (await items(cfg.live)).find(isCam);
      fixed.push('webcam');
    }
    if (cam && await fit(cfg.live, cam.sceneItemId)) fixed.push('webcam size');

    // Away scene with the looping recording.
    if (!sceneNames.includes(cfg.away)) { await call('CreateScene', { sceneName: cfg.away }); fixed.push('Away scene'); }
    const want = { is_local_file: true, local_file: loopPath, looping: true, close_when_inactive: true, restart_on_activate: true };
    let media = (await items(cfg.away)).find(i => i.inputKind === 'ffmpeg_source');
    if (!media) {
      await ensureInput(cfg.away, 'MIB Loop', 'ffmpeg_source', want);
      media = (await items(cfg.away)).find(i => i.inputKind === 'ffmpeg_source');
      fixed.push('loop source');
    }
    const cur = (await call('GetInputSettings', { inputName: media.sourceName })).inputSettings;
    if (Object.entries(want).some(([k, v]) => cur[k] !== v)) {
      await call('SetInputSettings', { inputName: media.sourceName, inputSettings: want, overlay: true });
      fixed.push('loop settings');
    }
    try {
      const m = await call('GetInputAudioMonitorType', { inputName: media.sourceName });
      if (m.monitorType !== 'OBS_MONITORING_TYPE_NONE')
        await call('SetInputAudioMonitorType', { inputName: media.sourceName, monitorType: 'OBS_MONITORING_TYPE_NONE' });
    } catch {}
    if (await fit(cfg.away, media.sceneItemId)) fixed.push('loop size');

    // If OBS is showing some other scene (e.g. a fresh install's "Scene"), start on Live.
    if (state.scene !== cfg.live && state.scene !== cfg.away) await call('SetCurrentProgramScene', { sceneName: cfg.live });

    state.setupOk = true;
    if (fixed.length) say('All set ✓');
  } catch (e) {
    state.setupOk = false;
    say('Something isn’t set up right — ask Iris.');
  }
}

/* ---------- live preview ---------- */
// Preferred: open the "OBS Virtual Camera" device directly = exactly what Webex sees, smooth video.
// Fallback: ask OBS for a snapshot of the current scene a few times a second.
let previewMode = null, snapTimer = null;
async function startPreview() {
  if (previewMode === 'camera') return;
  try {
    const md = navigator.mediaDevices;
    if (!md || !md.getUserMedia) throw new Error('no camera API');
    let devs = await md.enumerateDevices();
    if (!devs.some(d => d.kind === 'videoinput' && d.label)) {
      const tmp = await md.getUserMedia({ video: true }); // ask permission once so device names appear
      tmp.getTracks().forEach(t => t.stop());
      devs = await md.enumerateDevices();
    }
    const obsCam = devs.find(d => d.kind === 'videoinput' && /obs/i.test(d.label));
    if (!obsCam) throw new Error('OBS Virtual Camera not found');
    const stream = await md.getUserMedia({ video: { deviceId: { exact: obsCam.deviceId }, width: 1280, height: 720 } });
    const pv = $('pv'); pv.srcObject = stream; pv.style.display = 'block';
    const fit = () => { if (pv.videoWidth) $('pv').parentElement.style.aspectRatio = pv.videoWidth + ' / ' + pv.videoHeight; };
    pv.onloadedmetadata = fit; pv.onresize = fit;
    $('pi').style.display = 'none'; $('pe').style.display = 'none';
    stopSnapshots(); previewMode = 'camera';
    stream.getVideoTracks()[0].addEventListener('ended', () => { previewMode = null; pv.style.display = 'none'; startSnapshots(); });
  } catch (e) {
    startSnapshots();
  }
}
function startSnapshots() {
  if (previewMode === 'snap') return;
  previewMode = 'snap'; stopSnapshots();
  let busy = false;
  snapTimer = setInterval(async () => {
    if (!identified || !state.scene || busy) return;
    busy = true;
    try {
      const r = await call('GetSourceScreenshot', { sourceName: state.scene, imageFormat: 'jpg',
        imageCompressionQuality: 70 });
      const pi = $('pi'); pi.src = r.imageData; pi.style.display = 'block'; $('pe').style.display = 'none';
      pi.onload = () => { if (pi.naturalWidth) pi.parentElement.style.aspectRatio = pi.naturalWidth + ' / ' + pi.naturalHeight; };
    } catch {} finally { busy = false; }
  }, 250);
}
function stopSnapshots() { clearInterval(snapTimer); snapTimer = null; }
function onEvent(type, d) {
  if (type === 'CurrentProgramSceneChanged') {
    state.scene = d.sceneName;
    state.awayStart = d.sceneName === cfg.away ? Date.now() : null;
    store.set('awayStart', state.awayStart || 0);
  }
  if (type === 'VirtualcamStateChanged') state.vcam = !!d.outputActive;
  if (type === 'RecordStateChanged') {
    if (d.outputState === 'OBS_WEBSOCKET_OUTPUT_STARTED') { state.recording = true; state.recStart = Date.now(); }
    if (d.outputState === 'OBS_WEBSOCKET_OUTPUT_STOPPED') {
      state.recording = false;
      store.set('lastLoop', Date.now());
      // Loop is saved → go straight to Away (short pause so OBS has finished writing the file).
      setTimeout(() => call('SetCurrentProgramScene', { sceneName: cfg.away })
        .then(() => say('Away video saved ✓ — you’re now Away. Mute Webex (⌘⇧M)'))
        .catch(e => say(e.message)), 500);
    }
  }
  render();
}

/* ---------- UI ---------- */
function setConn(text, cls) { $('conn').textContent = text; $('dot').className = 'dot ' + cls; }
function say(t) { $('msg').textContent = t; }
function fmt(ms) { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

function render() {
  const on = identified;
  const badge = $('badge');
  badge.className = 'badge' + (on && state.scene === cfg.live ? ' live' : on && state.scene === cfg.away ? ' away' : '');
  const awayFor = state.awayStart ? fmt(Date.now() - state.awayStart) : '';
  badge.textContent = on && state.scene === cfg.live ? '● LIVE' : on && state.scene === cfg.away ? '⏸ AWAY · ' + awayFor : '';
  $('awaySub').textContent = on && state.scene === cfg.away ? `Away for ${awayFor} · Webex muted? ⌘⇧M` : 'Show the away video · then mute Webex ⌘⇧M';

  // How old is the away video? Green under an hour, red after.
  const last = Number(store.get('lastLoop', 0)), el = $('loopage');
  if (!last) { el.className = 'loopage old'; el.textContent = 'No away video yet'; }
  else {
    const mins = Math.floor((Date.now() - last) / 60000);
    const ago = mins < 1 ? 'just now' : mins < 60 ? `${mins} min ago` : `${Math.floor(mins / 60)} h ${mins % 60} min ago`;
    el.className = 'loopage ' + (mins < 60 ? 'fresh' : 'old');
    el.textContent = `Away video recorded ${ago}`;
  }
  $('recbadge').classList.toggle('on', state.recording);
  $('live').classList.toggle('active', on && state.scene === cfg.live);
  $('away').classList.toggle('active', on && state.scene === cfg.away);
  $('rec').classList.toggle('on', state.recording);
  $('recLabel').textContent = state.recording ? 'Stop recording · ' + fmt(Date.now() - state.recStart) : 'Record away video';
  $('recSub').textContent = state.recording ? 'Press to stop and go Away' : 'Sit still for 1–2 minutes, then press again';
  // Safety rules: only record while Live; never go Away while recording.
  $('rec').disabled = !on || (!state.recording && state.scene !== cfg.live);
  $('away').disabled = !on || state.recording || state.scene === cfg.away;
  $('live').disabled = !on || state.scene === cfg.live;
}
setInterval(() => { if (state.recording || state.awayStart) render(); }, 1000);
setInterval(render, 30000); // keeps the away-video age fresh

$('rec').onclick = async () => {
  try { await call(state.recording ? 'StopRecord' : 'StartRecord'); }
  catch (e) { say(e.message); }
};
$('away').onclick = () => call('SetCurrentProgramScene', { sceneName: cfg.away })
  .then(() => say('Away — remember to mute Webex (⌘⇧M)')).catch(e => say(e.message));
$('live').onclick = () => call('SetCurrentProgramScene', { sceneName: cfg.live })
  .then(() => say('Live — unmute Webex when ready (⌘⇧M)')).catch(e => say(e.message));
$('save').onclick = () => {
  store.set('pw', $('pw').value); store.set('port', $('port').value.trim() || '4455');
  store.set('live', $('liveName').value.trim() || 'Live'); store.set('away', $('awayName').value.trim() || 'Away');
  loadCfg(); connect();
};

loadCfg(); render(); connect();
</script>
</body>
</html>
